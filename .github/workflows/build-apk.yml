name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/OmniGrab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniGrab-Android-App-APK
          path: release_apk/OmniGrab.apk
          retention-days: 30

      - name: Create Direct APK GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest-release
          name: "OmniGrab Android App v1.0"
          body: "Direct download link for OmniGrab APK."
          files: release_apk/OmniGrab.apk
          prerelease: false
          make_latest: true


